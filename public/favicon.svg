<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <style>
    :root {
      --bg: #F7F4EE;
      --charcoal: #182226;
      --accent: #E2583E;
      --check: #1F695C;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171A;
        --charcoal: #F5F3ED;
        --accent: #E2583E;
        --check: #34D399;
      }
    }
    .bg { fill: var(--bg); }
    .mark { fill: var(--charcoal); }
    .badge { stroke: var(--accent); fill: none; }
    .badge-dot { fill: var(--accent); }
    .check { stroke: var(--check); fill: none; }
  </style>

  <rect class="bg" width="512" height="512" rx="112" />

  <g transform="translate(56, 56)">
    <path class="mark" d="M 64 74 L 114 74 L 114 326 L 64 326 Z" />
    <path class="mark" d="M 48 74 L 130 74 L 130 88 L 48 88 Z" />
    <path class="mark" d="M 48 312 L 130 312 L 130 326 L 48 326 Z" />

    <rect class="mark" x="114" y="190" width="94" height="28" />

    <polygon class="mark" points="164,326 212,326 260,98 216,98" />
    <polygon class="mark" points="248,98 292,98 348,326 300,326 270,206 214,206" />

    <path class="mark" d="M 150 320 L 220 320 L 220 326 L 150 326 Z" />
    <path class="mark" d="M 288 320 L 362 320 L 362 326 L 288 326 Z" />

    <g transform="translate(254, 38)">
      <polygon class="badge" points="52,0 96,24 96,74 52,98 8,74 8,24" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" />
      <circle class="badge-dot" cx="52" cy="49" r="6" />
      <path class="check" d="M 76 76 L 92 92 L 120 60" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
